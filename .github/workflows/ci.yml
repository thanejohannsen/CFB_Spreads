name: CI

on:
  push:
    # The updater commits only under docs/data, as often as every 20 minutes
    # through the decision window. Those commits change no code, so running the
    # suite (and its live Kalshi dry run) on them would be hundreds of pointless
    # runs a month against a rate-limited API.
    paths-ignore:
      - 'docs/data/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s pipeline/tests -t . -v
      - name: Pipeline dry run against the live Kalshi API
        run: python -m pipeline.build_predictions --dry-run

      # docs/app.js re-runs the pick rules over the JSON the pipeline commits.
      # Both sides claim to apply the same rules; this is the only thing that
      # notices when they stop. Runs against the committed current.json, so it
      # checks real numbers rather than a fixture that can be made to agree.
      - name: Page and pipeline agree on every pick
        run: node tools/conformance.js
