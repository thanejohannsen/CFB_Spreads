name: CI

on:
  push:
    # The updater commits only under docs/data, as often as every 20 minutes
    # through the decision window. Those commits change no code, so running the
    # suite (and its live Kalshi dry run) on them would be hundreds of pointless
    # runs a month against a rate-limited API.
    paths-ignore:
      - 'docs/data/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s pipeline/tests -t . -v
      - name: Pipeline dry run against the live Kalshi API
        run: python -m pipeline.build_predictions --dry-run
