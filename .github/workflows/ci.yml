name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s pipeline/tests -t . -v
      - name: Pipeline dry run against the live Kalshi API
        run: python -m pipeline.build_predictions --dry-run
